# Delta as the diff pager -- syntax-highlighted, line-level diff
# highlighting instead of lazygit's plain default. Requires `delta`
# (brew: git-delta) on PATH.
git:
  pagers:
    - name: delta
      pager: delta --dark --paging=never
      colorArg: always

# Official Dracula theme (draculatheme.com/lazygit)
gui:
  theme:
    activeBorderColor:
      - "#FF79C6"
      - bold
    inactiveBorderColor:
      - "#BD93F9"
    searchingActiveBorderColor:
      - "#8BE9FD"
      - bold
    optionsTextColor:
      - "#6272A4"
    selectedLineBgColor:
      - "#6272A4"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#6272A4"
    cherryPickedCommitBgColor:
      - "#8BE9FD"
    markedBaseCommitFgColor:
      - "#8BE9FD"
    markedBaseCommitBgColor:
      - "#F1FA8C"
    unstagedChangesColor:
      - "#FF5555"
    defaultFgColor:
      - "#F8F8F2"
