"$schema" = 'https://starship.rs/config-schema.json'

# Layout modeled on p10k's "Lean" preset (also similar to starship's own
# "Pure Prompt" preset) -- two-line, no powerline segments. Colors use
# starship's named ANSI colors (not hex/256 codes) so they follow whatever
# the terminal's colorscheme defines those slots as, matching p10k's own
# "8 colors" (terminal-native) option: blue dir, green branch/clean,
# yellow modified, cyan venv, no bold anywhere.

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$line_break\
$character"""

[directory]
style = "blue"
truncate_to_repo = false
# Approximates p10k's truncate_to_unique: show the full path rather than
# dropping leading components, but shorten every directory except the
# last to 1 character (starship has no true shortest-unique-prefix mode).
truncation_length = 1
fish_style_pwd_dir_length = 1

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "green"

[git_status]
format = " [(×$conflicted)](red)[(∗$modified$staged$renamed$deleted)($ahead_behind$stashed)]($style)"
style = "yellow"
conflicted = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[python]
format = " [$virtualenv]($style)"
style = "cyan"
detect_extensions = []
detect_files = []
