macos_defaults:
  - name: Non-natural trackpad/mouse scroll direction
    command: 'defaults write NSGlobalDomain com.apple.swipescrolldirection -bool false'
  - name: Don't auto-rearrange Spaces based on recent use
    command: 'defaults write com.apple.dock mru-spaces -bool false'
  - name: No press-and-hold accent popup (key repeat instead)
    command: 'defaults write NSGlobalDomain ApplePressAndHoldEnabled -bool false'
  - name: Fast key repeat rate
    command: 'defaults write NSGlobalDomain KeyRepeat -int 2'
  - name: Short initial key repeat delay
    command: 'defaults write NSGlobalDomain InitialKeyRepeat -int 15'
  - name: 'Finder: show hidden files'
    command: 'defaults write com.apple.finder AppleShowAllFiles -bool true'
  - name: 'Finder: show all filename extensions'
    command: 'defaults write NSGlobalDomain AppleShowAllExtensions -bool true'
  - name: 'Finder: show path bar'
    command: 'defaults write com.apple.finder ShowPathbar -bool true'
  - name: 'Finder: show status bar'
    command: 'defaults write com.apple.finder ShowStatusBar -bool true'
  - name: 'Dock: autohide'
    command: 'defaults write com.apple.dock autohide -bool true'
  - name: Save screenshots to ~/Screenshots
    command: 'mkdir -p "$HOME/Screenshots" && defaults write com.apple.screencapture location -string "$HOME/Screenshots"'
  - name: Hide desktop icons
    command: 'defaults write com.apple.finder CreateDesktop -bool false'
