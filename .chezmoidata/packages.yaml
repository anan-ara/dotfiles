# Keyed by app -- each top-level key here must exactly match an `apps.*`
# key prompted for in .chezmoi.toml.tmpl, since the install script matches
# them by string equality with no validation.
packages:
  zsh:
    brews:
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - vivid
    darwin_casks:
      - arc # dot_zshenv.tmpl sets $BROWSER to Arc, darwin only
  git:
    brews:
      - git-delta
  vim: {}
  neovim:
    brews:
      - neovim
      - ripgrep
      - fd
  lazygit:
    brews:
      - lazygit
      - git-delta # shared with git, used as lazygit's diff pager too
  yazi:
    brews:
      - yazi
  herdr:
    brews:
      - herdr
  cli_tools:
    brews:
      - eza
      - bat
      - fzf
      - zoxide
    darwin_brews:
      - coreutils
  ghostty:
    darwin_casks:
      - ghostty
      - font-hack-nerd-font
  karabiner:
    darwin_casks:
      - karabiner-elements
    darwin_brews:
      - yqrashawn/goku/goku
